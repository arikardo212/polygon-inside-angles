<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעבדת מצולעים ומשולשים משוכללת</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #1a73e8; margin-top: 0; margin-bottom: 10px; }
        
        /* תפריט מצבים (Tabs) */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background-color: #f1f3f4;
            color: #3c4043;
            border: 2px solid transparent;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .tab-btn:hover { background-color: #e8eaed; }
        .tab-btn.active {
            background-color: #e8f0fe;
            color: #1a73e8;
            border-color: #1a73e8;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            min-height: 45px;
        }
        button.action-btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        button.action-btn:hover { background-color: #1557b0; }
        
        .workspace {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        #canvas-container {
            position: relative;
            background: #fafafa;
            border: 2px dashed #ccc;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas { display: block; cursor: crosshair; }
        
        /* פאנל צידי פיתגורס */
        .side-panel {
            width: 240px;
            background: #f8f9fa;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 15px;
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .side-panel h3 { margin-top: 0; color: #202124; border-bottom: 2px solid #1a73e8; padding-bottom: 5px;}
        .triple-item { padding: 4px 0; font-family: monospace; font-size: 15px; }
        .triple-match {
            background-color: #d4edda;
            color: #155724;
            padding: 8px;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); } to { transform: scale(1.03); }
        }

        .stats {
            background: #e8f0fe;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #1967d2;
        }
        .instructions { font-size: 14px; color: #5f6368; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📐 מעבדת מצולעים ומשולשים דינמית</h1>
    <p class="instructions" id="main-instructions">בחר מצב עבודה מלמעלה כדי לחקור זוויות ומשולשים!</p>
    
    <!-- תפריט הטאבים -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchMode('irregular')">מצולע כללי (חופשי)</button>
        <button class="tab-btn" onclick="switchMode('regular')">מצולע משוכלל (מרכזיות)</button>
        <button class="tab-btn" onclick="switchMode('pythagoras')">משולש ישר זווית (פיתגורס)</button>
    </div>

    <!-- כפתורי שליטה דינמיים לפי המצב -->
    <div class="controls" id="controls-area">
        <!-- יתמלא אוטומטית על ידי הג'אווהסקריפט -->
    </div>

    <div class="workspace">
        <div id="canvas-container">
            <canvas id="mainCanvas" width="600" height="400"></canvas>
        </div>
        
        <!-- פאנל פיתגורס שיופיע רק במצב המתאים -->
        <div class="side-panel" id="pythagoras-panel" style="display: none;">
            <h3>שלשות פיתגוריות</h3>
            <div id="current-triple-status"></div>
            <div style="font-size: 13px; color:#666; margin-bottom:5px;">שלשות נפוצות לדוגמה:</div>
            <div class="triple-item">🔹 3 , 4 , 5</div>
            <div class="triple-item">🔹 5 , 12 , 13</div>
            <div class="triple-item">🔹 6 , 8 , 10</div>
            <div class="triple-item">🔹 8 , 15 , 17</div>
            <div class="triple-item">🔹 9 , 12 , 15</div>
        </div>
    </div>

    <div class="stats" id="stats-box">
        טוען מערכת...
    </div>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const statsBox = document.getElementById('stats-box');
    const controlsArea = document.getElementById('controls-area');
    const pythagorasPanel = document.getElementById('pythagoras-panel');
    const mainInstructions = document.getElementById('main-instructions');

    let currentMode = 'irregular'; // 'irregular' | 'regular' | 'pythagoras'
    let numSides = 4;
    let vertices = [];
    let draggedVertex = null;
    const vertexRadius = 10;

    // משתני משולש ישר זווית
    let pythBase = 4;  // יחידות מדומות (כל יחידה = 40 פיקסלים)
    let pythHeight = 3; 
    let pythDraggedHandle = null; // 'base' | 'height'

    function switchMode(mode) {
        currentMode = mode;
        draggedVertex = null;
        pythDraggedHandle = null;
        
        // עדכון כפתורי תפריט
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(btn => btn.innerText.includes(
            mode === 'irregular' ? 'כללי' : mode === 'regular' ? 'משוכלל' : 'ישר זווית'
        ));
        if (activeBtn) activeBtn.classList.add('active');

        // הסתרה/הצגה של הפאנל הצידי
        pythagorasPanel.style.display = (mode === 'pythagoras') ? 'block' : 'none';

        // בניית כפתורי שליטה והוראות בהתאם למצב
        if (mode === 'irregular') {
            mainInstructions.textContent = "גררו את הנקודות הכחולות. המערכת תחשב ותציג רק את הזוויות הפנימיות שבתוך הצורה!";
            controlsArea.innerHTML = `
                <button class="action-btn" onclick="changeSides(-1)">➖ פחות צלע</button>
                <span id="sides-count" style="font-size: 18px; font-weight: bold;">צלעות: ${numSides}</span>
                <button class="action-btn" onclick="changeSides(1)">➕ הוסף צלע</button>
            `;
            initPolygon(numSides);
        } else if (mode === 'regular') {
            mainInstructions.textContent = "שנו את מספר הצלעות. הקווים המקווקווים מגיעים מהמרכז ומציגים את הזוויות המרכזיות!";
            controlsArea.innerHTML = `
                <button class="action-btn" onclick="changeSides(-1)">➖ פחות צלע</button>
                <span id="sides-count" style="font-size: 18px; font-weight: bold;">צלעות: ${numSides}</span>
                <button class="action-btn" onclick="changeSides(1)">➕ הוסף צלע</button>
            `;
            initPolygon(numSides);
        } else if (mode === 'pythagoras') {
            mainInstructions.textContent = "גררו את הידיות הכתומות בקצוות המשולש כדי לשנות את אורך הניצבים ולגלות שלשות פיתגורס!";
            controlsArea.innerHTML = `
                <button class="action-btn" onclick="pythBase=4; pythHeight=3; draw();" style="background-color: #34a853;">🔄 איפוס ל-3,4,5</button>
            `;
            draw();
        }
    }

    function initPolygon(sides) {
        numSides = sides;
        vertices = [];
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = 120;

        for (let i = 0; i < numSides; i++) {
            const angle = (i * 2 * Math.PI) / numSides - Math.PI / 4; 
            vertices.push({
                x: centerX + radius * Math.cos(angle),
                y: centerY + radius * Math.sin(angle)
            });
        }
        const lbl = document.getElementById('sides-count');
        if (lbl) lbl.textContent = `צלעות: ${numSides}`;
        draw();
    }

    function changeSides(amount) {
        let newSides = numSides + amount;
        if (newSides >= 3 && newSides <= 12) {
            numSides = newSides;
            const lbl = document.getElementById('sides-count');
            if (lbl) lbl.textContent = `צלעות: ${numSides}`;
            initPolygon(numSides);
        }
    }

    // פונקציות עזר למצולע כללי (חישוב נקודה פנימית)
    function isPointInPolygon(px, py) {
        let inside = false;
        for (let i = 0, j = numSides - 1; i < numSides; j = i++) {
            const xi = vertices[i].x, yi = vertices[i].y;
            const xj = vertices[j].x, yj = vertices[j].y;
            const intersect = ((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi);
            if (intersect) inside = !inside;
        }
        return inside;
    }

    function calculateInteriorAngles() {
        const angles = [];
        let area = 0;
        for (let i = 0; i < numSides; i++) {
