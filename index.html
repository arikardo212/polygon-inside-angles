<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעבדת גיאומטריה דינמית</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 850px; width: 100%; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .tab-btn { background: #f1f3f4; border: 2px solid transparent; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .tab-btn.active { background: #e8f0fe; color: #1a73e8; border-color: #1a73e8; }
        .controls { margin-bottom: 15px; display: flex; justify-content: center; align-items: center; gap: 10px; min-height: 40px; }
        .btn { background: #1a73e8; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .workspace { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        #canvas-container { background: #fafafa; border: 2px dashed #ccc; border-radius: 8px; }
        .side-panel { width: 180px; background: #f8f9fa; border: 1px solid #dadce0; border-radius: 8px; padding: 12px; text-align: right; }
        .triple-match { background: #d4edda; color: #155724; padding: 8px; border-radius: 5px; font-weight: bold; text-align: center; }
        .stats { background: #e8f0fe; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; color: #1967d2; margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h2 style="color:#1a73e8; margin:0 0 15px;">📐 מעבדת גיאומטריה דינמית</h2>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchMode('irregular', event)">מצולע כללי</button>
        <button class="tab-btn" onclick="switchMode('regular', event)">מצולע משוכלל</button>
        <button class="tab-btn" onclick="switchMode('pythagoras', event)">משולש ישר זווית</button>
    </div>
    <div class="controls" id="controls-area"></div>
    <div class="workspace">
        <div id="canvas-container"><canvas id="mainCanvas" width="540" height="360"></canvas></div>
        <div class="side-panel" id="pythagoras-panel" style="display:none;">
            <h4 style="margin:0 0 8px; border-bottom:2px solid #1a73e8;">שלשות פיתגורס</h4>
            <div id="current-triple-status"></div>
            <p style="font-size:11px; color:#666; margin:8px 0 0;">שלשות מוכרות:<br>3, 4, 5<br>5, 12, 13<br>6, 8, 10<br>8, 15, 17</p>
        </div>
    </div>
    <div class="stats" id="stats-box">טוען מערכת...</div>
</div>

<script>
    const canvas = document.getElementById('mainCanvas'), ctx = canvas.getContext('2d');
    const statsBox = document.getElementById('stats-box'), controlsArea = document.getElementById('controls-area'), pythagorasPanel = document.getElementById('pythagoras-panel');
    let currentMode = 'irregular', numSides = 4, vertices =, draggedVertex = null, pythBase = 4, pythHeight = 3, pythDragged = null;
    const vertexRadius = 10, scale = 25, originX = 150, originY = 280;

    function switchMode(mode, e) {
        currentMode = mode; draggedVertex = pythDragged = null;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        if(e) e.target.classList.add('active'); else document.querySelector('.tab-btn').classList.add('active');
        pythagorasPanel.style.display = (mode === 'pythagoras') ? 'block' : 'none';
        if (mode === 'pythagoras') {
            controlsArea.innerHTML = '<button class="btn" onclick="pythBase=4;pythHeight=3;draw();" style="background:#34a853;">איפוס ל-3,4,5</button>';
        } else {
            controlsArea.innerHTML = `<button class="btn" onclick="changeSides(-1)">➖ פחות צלע</button> <span id="sides-cnt" style="font-weight:bold;margin:0 5px;">צלעות: ${numSides}</span> <button class="btn" onclick="changeSides(1)">➕ הוסף צלע</button>`;
        }
        initPolygon();
    }

    function initPolygon() {
        if (currentMode === 'pythagoras') { draw(); return; }
        vertices =; const cx = canvas.width / 2, cy = canvas.height / 2, r = 100;
        for (let i = 0; i < numSides; i++) {
            const a = (i * 2 * Math.PI) / numSides - Math.PI / 4;
            vertices.push({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) });
        }
        const lbl = document.getElementById('sides-cnt'); if(lbl) lbl.textContent = `צלעות: ${numSides}`;
        draw();
    }

    function changeSides(amt) { let s = numSides + amt; if (s >= 3 && s <= 12) { numSides = s; initPolygon(); } }

    function isPointInPoly(px, py) {
        let inside = false;
        for (let i = 0, j = numSides - 1; i < numSides; j = i++) {
            if (((vertices[i].y > py) !== (vertices[j].y > py)) && (px < (vertices[j].x - vertices[i].x) * (py - vertices[i].y) / (vertices[j].y - vertices[i].y) + vertices[i].x)) inside = !inside;
        }
        return inside;
    }
</script>
<script>
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (currentMode === 'irregular' || currentMode === 'regular') {
            ctx.beginPath(); ctx.moveTo(vertices.x, vertices.y);
            for(let i=1; i<numSides; i++) ctx.lineTo(vertices[i].x, vertices[i].y);
            ctx.closePath(); ctx.fillStyle = currentMode==='irregular'?'rgba(26,115,232,0.05)':'rgba(52,168,83,0.05)'; ctx.fill();
            ctx.strokeStyle = currentMode==='irregular'?'#1a73e8':'#34a853'; ctx.lineWidth = 3; ctx.stroke();
        }

        if (currentMode === 'irregular') {
            let area = 0; for(let i=0; i<numSides; i++) { let j=(i+1)%numSides; area += (vertices[i].x*vertices[j].y)-(vertices[j].x*vertices[i].y); }
            let isCCW = area > 0, sum = 0;
            for(let i=0; i<numSides; i++) {
                const p = vertices[(i-1+numSides)%numSides], c = vertices[i], n = vertices[(i+1)%numSides];
                const ap = Math.atan2(p.y-c.y, p.x-c.x), an = Math.atan2(n.y-c.y, n.x-c.x);
                let diff = an - ap; if(diff < 0) diff += 2 * Math.PI;
                let mid = ap + diff/2;
                if (!isPointInPoly(c.x + 15 * Math.cos(mid), c.y + 15 * Math.sin(mid))) { diff = 2*Math.PI - diff; mid += Math.PI; }
                let deg = diff * 180 / Math.PI; sum += deg;
                ctx.beginPath(); ctx.arc(c.x, c.y, 20, ap, an, !isCCW); ctx.strokeStyle = '#e37405'; ctx.stroke();
                ctx.fillStyle = '#d93025'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(`${Math.round(deg)}°`, c.x + 38 * Math.cos(mid), c.y + 38 * Math.sin(mid));
            }
            vertices.forEach(v => { ctx.beginPath(); ctx.arc(v.x, v.y, vertexRadius, 0, 2*Math.PI); ctx.fillStyle = '#1a73e8'; ctx.fill(); ctx.strokeStyle='white'; ctx.stroke(); });
            statsBox.textContent = `סכום זוויות תיאורטי: ${(numSides-2)*180}° | נמדד: ${Math.round(sum)}°`;
        } 
        else if (currentMode === 'regular') {
            const cx = canvas.width/2, cy = canvas.height/2, ca = 360/numSides;
            for(let i=0; i<numSides; i++) {
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(vertices[i].x, vertices[i].y); ctx.strokeStyle = '#ccc'; ctx.stroke();
                let a1 = Math.atan2(vertices[i].y-cy, vertices[i].x-cx), a2 = Math.atan2(vertices[(i+1)%numSides].y-cy, vertices[(i+1)%numSides].x-cx);
                let ma = a1 + (a2-a1)/2; if(a2<a1 && (a1-a2)>Math.PI) ma += Math.PI;
                ctx.beginPath(); ctx.arc(cx, cy, 25, a1, a2); ctx.strokeStyle = '#e37405'; ctx.stroke();
                ctx.fillStyle = '#d93025'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(`${Math.round(ca)}°`, cx + 45 * Math.cos(ma), cy + 45 * Math.sin(ma));
            }
            ctx.beginPath(); ctx.arc(cx, cy, 4, 0, 2*Math.PI); ctx.fillStyle = '#333'; ctx.fill();
            statsBox.textContent = `מצולע משוכלל | זווית מרכזית: ${Math.round(ca)}° | זווית פנימית: ${Math.round(((numSides-2)*180)/numSides)}°`;
        } 
        else if (currentMode === 'pythagoras') {
            const ex = originX + pythBase * scale, ey = originY - pythHeight * scale;
            ctx.beginPath(); ctx.moveTo(originX, originY); ctx.lineTo(ex, originY); ctx.lineTo(originX, ey); ctx.closePath();
            ctx.fillStyle = 'rgba(241,139,14,0.05)'; ctx.fill(); ctx.strokeStyle = '#f18b0e'; ctx.lineWidth = 3; ctx.stroke();
            ctx.beginPath(); ctx.rect(originX, originY - 12, 12, 12); ctx.strokeStyle = '#666'; ctx.stroke();
            ctx.fillStyle = '#202124'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(`a = ${pythBase}`, originX + (pythBase*scale)/2, originY + 20);
            ctx.textAlign = 'right'; ctx.fillText(`b = ${pythHeight}`, originX - 10, originY - (pythHeight*scale)/2);
            let hyp = Math.sqrt(pythBase*pythBase + pythHeight*pythHeight);
            ctx.textAlign = 'left'; ctx.fillText(`c = ${hyp.toFixed(2)}`, originX + (pythBase*scale)/2 + 8, originY - (pythHeight*scale)/2 - 8);
            ctx.beginPath(); ctx.arc(ex, originY, vertexRadius, 0, 2*Math.PI); ctx.fillStyle = '#e37405'; ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(originX, ey, vertexRadius, 0, 2*Math.PI); ctx.fillStyle = '#e37405'; ctx.fill(); ctx.stroke();
            const isT = Number.isInteger(Math.round(hyp*1000)/1000);

            document.getElementById('current-triple-status').innerHTML = isT ? 
                `<div class="triple-match">🎉 שלשה פיתגורית!<br>[${pythBase}, ${pythHeight}, ${Math.round(hyp)}]</div>` : 
                `<div style="font-size:12px;color:#666;border:1px dashed #ccc;padding:5px;text-align:center;">${pythBase}² + ${pythHeight}² = ${pythBase*pythBase+pythHeight*pythHeight}</div>`;
            statsBox.textContent = `משפט פיתגורס: ${pythBase}² + ${pythHeight}² = ${isT ? Math.round(hyp) : hyp.toFixed(2)}²`;
        }
    }

    function getMouse(e) { const r = canvas.getBoundingClientRect(); const x = e.touches ? e.touches.clientX : e.clientX; const y = e.touches ? e.touches.clientY : e.clientY; return { x: x - r.left, y: y - r.top }; }
    function handlerStart(p) {
        if (currentMode === 'irregular') { vertices.forEach(v => { if(Math.hypot(v.x-p.x, v.y-p.y) < vertexRadius+8) draggedVertex = v; }); }
        else if (currentMode === 'pythagoras') {
            if(Math.hypot((originX+pythBase*scale)-p.x, originY-p.y) < vertexRadius+10) pythDragged = 'b'; if(Math.hypot(originX-p.x, (originY-pythHeight*scale)-p.y) < vertexRadius+10) pythDragged = 'h';
        }
    }
    function handlerMove(p) {
        if (draggedVertex) { draggedVertex.x = Math.max(10, Math.min(canvas.width-10, p.x)); draggedVertex.y = Math.max(10, Math.min(canvas.height-10, p.y)); }
        if (pythDragged === 'b') pythBase = Math.max(1, Math.min(15, Math.round((p.x-originX)/scale)));
        if (pythDragged === 'h') pythHeight = Math.max(1, Math.min(10, Math.round((originY-p.y)/scale)));
    }

    canvas.addEventListener('mousedown', (e) => handlerStart(getMouse(e)));
    canvas.addEventListener('mousemove', (e) => { if(draggedVertex||pythDragged) { e.preventDefault(); handlerMove(getMouse(e)); draw(); } });
    window.addEventListener('mouseup', () => draggedVertex = pythDragged = null);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handlerStart(getMouse(e)); }, {passive:false});
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handlerMove(getMouse(e)); draw(); }, {passive:false});
    canvas.addEventListener('touchend', () => draggedVertex = pythDragged = null);

    switchMode('irregular');
</script>
</body>
</html>
